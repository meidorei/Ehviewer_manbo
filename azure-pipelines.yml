# Android
# Build your Android project with Gradle.
# Add steps that test, sign, and distribute the APK, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/android

trigger:
- BiLi_PC_Gamer

pool:
  vmImage: 'macos-latest'

steps:
- task: Gradle@2
  inputs:
    workingDirectory: ''
    gradleWrapperFile: 'gradlew'
    gradleOptions: '-Xmx3072m'
    publishJUnitResults: true
    testResultsFiles: '**/TEST-*.xml'
    tasks: 'assembleDebug'

# Define both AndroidSigning password variables as secrets in Azure Pipelines.
# Keep the original signing key in Secure Files; never commit it to this repository.
- task: AndroidSigning@2
  inputs:
    apkFiles: 'build/Ehviewer.apk'
    jarsign: true
    jarsignerKeystoreFile: 'text.key'
    jarsignerKeystorePassword: '$(AndroidSigningKeystorePassword)'
    jarsignerKeystoreAlias: '1234'
    jarsignerKeyPassword: '$(AndroidSigningKeyPassword)'
    zipalign: true
